<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="여행지리 수업용 여행 계획 지도 앱. 입력한 내용은 사용 중인 기기에만 저장됩니다.">
  <title>Travel Internship</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Cpath d='M12 1.2C6.62 1.2 2.26 5.56 2.26 10.94c0 6.9 8.32 18.5 8.68 18.99a1.32 1.32 0 0 0 2.12 0c.36-.49 8.68-12.09 8.68-18.99C21.74 5.56 17.38 1.2 12 1.2z' fill='%231d4ed8'/%3E%3Ccircle cx='12' cy='11' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/mapbox-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="app-header">
    <div class="app-header-inner">
      <p class="app-logo">Travel Internship</p>
      <button id="btn-settings" class="btn btn-ghost btn-sm" type="button" aria-label="설정">설정</button>
    </div>
    <nav class="stepper" aria-label="진행 단계">
      <button class="step" type="button" data-step="1"><span class="step-num">1</span><span>여행 정보</span></button>
      <button class="step" type="button" data-step="2"><span class="step-num">2</span><span>지도 · 방문지</span></button>
      <button class="step" type="button" data-step="3"><span class="step-num">3</span><span>순서 · PDF</span></button>
    </nav>
  </header>

  <main class="app-main" id="main">
    <section class="page" data-page="1">
      <h1 class="page-title">여행 정보 입력</h1>
      <p class="page-lead">여행 명칭과 학번·이름, 여행할 도시를 정해 주세요. 네 항목을 모두 채우면 다음으로 넘어갈 수 있습니다.</p>
      <div class="page-body"></div>
    </section>

    <section class="page" data-page="2">
      <h1 class="page-title">지도에 방문지 표시하기</h1>
      <p class="page-lead">숙소·관광 명소·현지 맛집·엑티비티를 원하는 만큼 추가할 수 있습니다. (합계 최대 20곳)</p>
      <div class="page-body"></div>
    </section>

    <section class="page" data-page="3">
      <h1 class="page-title">방문 순서와 비용 정리</h1>
      <p class="page-lead">순서를 바꾸면 지도의 번호와 경로, 총비용이 바로 다시 계산됩니다.</p>
      <div class="page-body"></div>
    </section>
  </main>

  <nav class="app-nav" aria-label="페이지 이동">
    <button class="btn btn-ghost" type="button" data-nav="-1">← 이전</button>
    <button class="btn btn-primary page-next" type="button" data-nav="1">다음 →</button>
  </nav>

  <footer class="app-footer">
    <p>입력한 내용은 사용 중인 기기에만 저장되며 서버로 전송되지 않습니다.</p>
    <p>지도 데이터 © Mapbox © OpenStreetMap</p>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:16px">이 앱을 사용하려면 브라우저의 자바스크립트를 켜 주세요.</p>
  </noscript>

  <!-- vendor/mapbox-gl.js 는 2페이지에 처음 들어갈 때 js/map.js 가 동적으로 불러옵니다. -->
  <script type="module">
    import { boot } from "./js/app.js";
    boot().catch((err) => {
      console.error(err);
      alert("앱을 시작하지 못했습니다.\n" + (err && err.message ? err.message : ""));
    });
  </script>
</body>
</html>
